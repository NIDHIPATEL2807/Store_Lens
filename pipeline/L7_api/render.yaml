services:
  - type: web
    name: purplle-analytics-api
    runtime: python
    rootDir: pipeline/L7_api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --app-dir app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: data/store.db
      - key: DEBUG
        value: "false"
